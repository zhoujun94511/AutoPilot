name: web-live

on:
  workflow_dispatch:
  schedule:
    # 每日 UTC 18:00 ≈ 北京时间次日 02:00
    - cron: "0 18 * * *"

jobs:
  web-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web_playwright]"
          playwright install chromium

      - name: Web unit smoke (engine + platform parity)
        run: |
          python -m pytest -p no:xonsh \
            tests/test_web_engine.py \
            tests/test_platform_web_engine_smoke.py \
            -q --tb=short

      - name: Web live white-box (selenium + playwright)
        run: python -m pytest -p no:xonsh tests/test_web_live.py -q --tb=short
