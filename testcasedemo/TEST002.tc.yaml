    params:
      type: ios
      appFile: D:\testscope\AIID\ipa\aitou.ipa
  - step: web_common_sleep
    comment: 在进行下一操作前，等待一段时间（单位：毫秒，例如：等待5秒请输入5000）
    params:
      millis: '3000'
  - step: elementClick
    comment: 判断控件是否存在，存在则点击；不存在则不做操作
